<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#13132B"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EF4444"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="url(#bgGrad)" rx="12"/>
  <rect width="960" height="680" fill="none" stroke="#2D2D3E" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#A78BFA">ClaimLens — System Architecture</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#6B7280">Multi-Agent Hoax Auditor · Nebius AI + Free APIs + MongoDB Atlas</text>

  <!-- ═══ USER INPUT ═══ -->
  <rect x="330" y="68" width="300" height="44" rx="10" fill="#1A1A2E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="480" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#A78BFA">USER INPUT</text>
  <text x="480" y="102" text-anchor="middle" font-size="10" fill="#9CA3AF">Viral Headline or Custom Claim</text>

  <!-- split arrows down-left and down-right -->
  <line x1="410" y1="112" x2="210" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="550" y1="112" x2="750" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ═══ APPROACH A COLUMN ═══ -->
  <rect x="30" y="148" width="310" height="34" rx="8" fill="url(#redGrad)"/>
  <text x="185" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="white">APPROACH A: Standard SEO  ·  Era 2 Baseline</text>
  <text x="185" y="174" text-anchor="middle" font-size="9" fill="#FCA5A5">Single LLM + Top Search Results</text>

  <!-- A: DuckDuckGo -->
  <rect x="54" y="202" width="262" height="46" rx="8" fill="#1E1E32" stroke="#EF4444" stroke-width="1"/>
  <text x="90" y="221" font-size="10" font-weight="700" fill="#F87171">🔍  DuckDuckGo Search</text>
  <text x="90" y="236" font-size="9" fill="#9CA3AF">Top 10 web results for claim</text>
  <text x="284" y="228" text-anchor="end" font-size="9" fill="#6B7280">free · no key</text>

  <line x1="185" y1="248" x2="185" y2="268" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- A: Single LLM -->
  <rect x="54" y="268" width="262" height="46" rx="8" fill="#1E1E32" stroke="#EF4444" stroke-width="1"/>
  <text x="90" y="287" font-size="10" font-weight="700" fill="#F87171">🤖  Single LLM Prompt</text>
  <text x="90" y="302" font-size="9" fill="#9CA3AF">Qwen3-235B · Summarise top results</text>

  <line x1="185" y1="314" x2="185" y2="334" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- A: Output -->
  <rect x="54" y="334" width="262" height="54" rx="8" fill="#2D1515" stroke="#EF4444" stroke-width="1.5"/>
  <text x="185" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#F87171">⚠  Unverified Summary</text>
  <text x="185" y="369" text-anchor="middle" font-size="9" fill="#FCA5A5">Echoes SEO rumors as facts</text>
  <text x="185" y="382" text-anchor="middle" font-size="9" fill="#9CA3AF">Fluent Prose Fraud</text>

  <!-- ═══ APPROACH B COLUMN ═══ -->
  <rect x="620" y="148" width="310" height="34" rx="8" fill="url(#purpleGrad)"/>
  <text x="775" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="white">APPROACH B: Agentic Auditor  ·  Era 3</text>
  <text x="775" y="174" text-anchor="middle" font-size="9" fill="#DDD6FE">Multi-Agent Primary-Source Grounding</text>

  <!-- B: Agent 1 — Claim Extractor -->
  <rect x="644" y="202" width="262" height="56" rx="8" fill="#1E1E32" stroke="#7C3AED" stroke-width="1"/>
  <text x="680" y="221" font-size="10" font-weight="700" fill="#A78BFA">① Claim Extractor Agent</text>
  <text x="680" y="236" font-size="9" fill="#9CA3AF">Breaks headline → 3-5 verifiable sub-claims</text>
  <text x="680" y="250" font-size="9" fill="#6B7280">Qwen3-30B (fast)</text>

  <line x1="775" y1="258" x2="775" y2="278" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- B: Agent 2 — Grounder -->
  <rect x="644" y="278" width="262" height="76" rx="8" fill="#1E1E32" stroke="#7C3AED" stroke-width="1"/>
  <text x="680" y="297" font-size="10" font-weight="700" fill="#A78BFA">② Grounder Agent</text>
  <text x="680" y="312" font-size="9" fill="#9CA3AF">Hunts .gov · .edu · PubMed · OpenFDA</text>
  <text x="680" y="325" font-size="9" fill="#9CA3AF">Wikipedia REST + OpenFDA REST</text>
  <text x="680" y="340" font-size="9" fill="#6B7280">Qwen3-235B (high quality)</text>
  <!-- API badges -->
  <rect x="680" y="346" width="64" height="14" rx="4" fill="#064E3B"/>
  <text x="712" y="356" text-anchor="middle" font-size="8" fill="#34D399">Wikipedia</text>
  <rect x="750" y="346" width="56" height="14" rx="4" fill="#064E3B"/>
  <text x="778" y="356" text-anchor="middle" font-size="8" fill="#34D399">OpenFDA</text>

  <line x1="775" y1="354" x2="775" y2="374" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- B: Agent 3 — Verifier -->
  <rect x="644" y="374" width="262" height="56" rx="8" fill="#1E1E32" stroke="#7C3AED" stroke-width="1"/>
  <text x="680" y="393" font-size="10" font-weight="700" fill="#A78BFA">③ Verifier Agent</text>
  <text x="680" y="408" font-size="9" fill="#9CA3AF">Conservative rewriter · assigns verdict</text>
  <text x="680" y="422" font-size="9" fill="#6B7280">Qwen3-235B · conservative rules</text>

  <line x1="775" y1="430" x2="775" y2="450" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- B: Verdict Output -->
  <rect x="644" y="450" width="262" height="60" rx="8" fill="#1A0A2E" stroke="#A78BFA" stroke-width="1.5" filter="url(#glow-purple)"/>
  <text x="775" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="#A78BFA">🔬 Verified Truth Scorecard</text>
  <text x="775" y="485" text-anchor="middle" font-size="9" fill="#DDD6FE">🟢 Verified · 🟡 Exaggerated · 🔴 Fabricated</text>
  <text x="775" y="500" text-anchor="middle" font-size="9" fill="#9CA3AF">Confidence % · SEO Echo Index · Rewrite</text>

  <!-- ═══ SHARED SEARCH POOL (centre) ═══ -->
  <rect x="360" y="202" width="240" height="52" rx="8" fill="#111120" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="221" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">⚡ Shared Search Pool</text>
  <text x="480" y="236" text-anchor="middle" font-size="9" fill="#4B5563">DuckDuckGo top 10 results</text>
  <text x="480" y="249" text-anchor="middle" font-size="9" fill="#4B5563">Run once · shared by both approaches</text>
  <!-- arrows from shared pool to both approaches -->
  <line x1="360" y1="228" x2="316" y2="228" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowGray)"/>
  <line x1="600" y1="228" x2="645" y2="228" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowGray)"/>

  <!-- ═══ CACHE LAYER ═══ -->
  <rect x="360" y="280" width="240" height="48" rx="8" fill="#111120" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="299" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">📦 Preset Cache</text>
  <text x="480" y="314" text-anchor="middle" font-size="9" fill="#4B5563">cache/*.json — pre-computed results</text>
  <text x="480" y="326" text-anchor="middle" font-size="9" fill="#4B5563">Presets load instantly without API call</text>

  <!-- ═══ MONGODB ═══ -->
  <rect x="360" y="360" width="240" height="60" rx="8" fill="url(#mongoGrad)" opacity="0.9"/>
  <text x="480" y="381" text-anchor="middle" font-size="10" font-weight="700" fill="white">🗄️  MongoDB Atlas</text>
  <text x="480" y="396" text-anchor="middle" font-size="9" fill="#A7F3D0">Persistent audit store</text>
  <text x="480" y="410" text-anchor="middle" font-size="9" fill="#6EE7B7">claimlens.audits collection</text>
  <!-- save arrows from both outputs -->
  <line x1="185" y1="388" x2="358" y2="388" stroke="#10B981" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
  <line x1="775" y1="510" x2="775" y2="540" stroke="#10B981" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="775" y1="540" x2="602" y2="390" stroke="#10B981" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>

  <!-- ═══ STREAMLIT UI TABS ═══ -->
  <rect x="30" y="548" width="900" height="110" rx="10" fill="#111120" stroke="#2D2D3E" stroke-width="1"/>
  <text x="480" y="567" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">STREAMLIT UI — 4 TABS</text>

  <rect x="50" y="576" width="195" height="66" rx="8" fill="#1A1A2E" stroke="#7C3AED" stroke-width="1"/>
  <text x="148" y="594" text-anchor="middle" font-size="10" font-weight="700" fill="#A78BFA">📊 Tab 1</text>
  <text x="148" y="609" text-anchor="middle" font-size="9" fill="#9CA3AF">Dual Comparison</text>
  <text x="148" y="622" text-anchor="middle" font-size="9" fill="#6B7280">A vs B side-by-side</text>
  <text x="148" y="635" text-anchor="middle" font-size="9" fill="#6B7280">Verdict card · Echo bar</text>

  <rect x="258" y="576" width="195" height="66" rx="8" fill="#1A1A2E" stroke="#0EA5E9" stroke-width="1"/>
  <text x="356" y="594" text-anchor="middle" font-size="10" font-weight="700" fill="#38BDF8">🔍 Tab 2</text>
  <text x="356" y="609" text-anchor="middle" font-size="9" fill="#9CA3AF">Source Explorer</text>
  <text x="356" y="622" text-anchor="middle" font-size="9" fill="#6B7280">SEO echo vs primary</text>
  <text x="356" y="635" text-anchor="middle" font-size="9" fill="#6B7280">Source labeling</text>

  <rect x="466" y="576" width="195" height="66" rx="8" fill="#1A1A2E" stroke="#F59E0B" stroke-width="1"/>
  <text x="564" y="594" text-anchor="middle" font-size="10" font-weight="700" fill="#FCD34D">🔄 Tab 3</text>
  <text x="564" y="609" text-anchor="middle" font-size="9" fill="#9CA3AF">Agent Trace</text>
  <text x="564" y="622" text-anchor="middle" font-size="9" fill="#6B7280">Step-by-step timing</text>
  <text x="564" y="635" text-anchor="middle" font-size="9" fill="#6B7280">Input / output per agent</text>

  <rect x="674" y="576" width="235" height="66" rx="8" fill="#1A1A2E" stroke="#10B981" stroke-width="1"/>
  <text x="792" y="594" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">📋 Tab 4</text>
  <text x="792" y="609" text-anchor="middle" font-size="9" fill="#9CA3AF">Audit History</text>
  <text x="792" y="622" text-anchor="middle" font-size="9" fill="#6B7280">MongoDB results</text>
  <text x="792" y="635" text-anchor="middle" font-size="9" fill="#6B7280">Load any past audit</text>
</svg>
